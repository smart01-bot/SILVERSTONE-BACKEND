services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: silverstone_dev
      POSTGRES_USER: silverstone
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silverstone -d silverstone_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
