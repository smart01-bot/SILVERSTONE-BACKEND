name: Backend CI

on:
  push:
    branches: [Main-Implementation, Development]
  pull_request:
    branches: [Main-Implementation, Development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
